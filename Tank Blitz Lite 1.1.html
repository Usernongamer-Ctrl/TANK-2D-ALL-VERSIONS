function aimGuide(t){const c=Math.cos(t.a),s=Math.sin(t.a),w=t.wp==='shell'||t.am<=0?'shell':t.wp,R=w==='laser'?Math.max(200,t.bs*1.5*G.o.brng):w==='missile'?Math.max(200,t.bs*.65)*3*G.o.brng:780*G.o.brng;let L=t.r*1.3,hit=null;for(;L<R;L+=6){const x=t.x+c*L,y=t.y+s*L,v=G.g[y/T|0]?.[x/T|0];if(v===undefined||v===1||v===2||v>=12)break;if(!hit||w==='laser')for(const o of G.tanks)if(!o.dead&&o.team!==t.team&&Math.hypot(o.x-x,o.y-y)<o.r+3){hit=o;break}if(hit&&w!=='laser')break}const x1=t.x+c*t.r*1.3,y1=t.y+s*t.r*1.3,x2=t.x+c*L,y2=t.y+s*L;cx.save();cx.setLineDash([7,7]);cx.globalAlpha=.7;cx.strokeStyle=hit?'#ff3b3b':TC[t.team];cx.lineWidth=2;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x2,y2);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1;cx.beginPath();cx.arc(x2,y2,hit?11:8,0,7);cx.moveTo(x2-14,y2);cx.lineTo(x2+14,y2);cx.moveTo(x2,y2-14);cx.lineTo(x2,y2+14);cx.stroke();if(hit){cx.strokeStyle='#ff3b3b';cx.beginPath();cx.arc(hit.x,hit.y,hit.r+8,0,7);cx.stroke()}cx.restore()}
